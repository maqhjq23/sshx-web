<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSHx — Web SSH Terminal</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Auth Screen -->
        <div id="auth-screen" class="screen hidden">
            <div class="card auth-card">
                <div class="logo">SSHx</div>
                <p class="subtitle">Web Authentication</p>
                <form id="auth-form">
                    <div class="form-group">
                        <input type="text" id="auth-username" placeholder="Username" autocomplete="username" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                    <p id="auth-error" class="error-text hidden"></p>
                </form>
            </div>
        </div>

        <!-- Connect Screen -->
        <div id="connect-screen" class="screen">
            <div class="card connect-card">
                <div class="logo">SSHx</div>
                <p class="subtitle">Web SSH Terminal</p>
                <form id="connect-form">
                    <div class="form-row">
                        <div class="form-group flex-2">
                            <label>Host</label>
                            <input type="text" id="ssh-host" placeholder="192.168.1.100" value="" required>
                        </div>
                        <div class="form-group flex-1">
                            <label>Port</label>
                            <input type="number" id="ssh-port" placeholder="22" value="8022" min="1" max="65535">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="ssh-username" placeholder="root" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-toggle">
                            <input type="password" id="ssh-password" placeholder="Leave empty for key auth">
                            <button type="button" class="toggle-btn" onclick="togglePassword('ssh-password', this)" tabindex="-1">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                    </div>
                    <details class="key-auth-section">
                        <summary>Private Key Auth</summary>
                        <div class="form-group">
                            <label>Private Key (PEM)</label>
                            <textarea id="ssh-private-key" rows="4" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----
...
-----END OPENSSH PRIVATE KEY-----" spellcheck="false"></textarea>
                        </div>
                    </details>
                    <button type="submit" class="btn btn-primary btn-connect">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                        Connect
                    </button>
                    <p id="connect-error" class="error-text hidden"></p>
                    <p class="hint">Connect to your Termux SSH server remotely</p>
                </form>
            </div>
        </div>

        <!-- Terminal Screen -->
        <div id="terminal-screen" class="screen hidden">
            <div class="terminal-container">
                <div class="terminal-header">
                    <div class="terminal-header-left">
                        <div class="status-dot"></div>
                        <span id="connection-info" class="connection-info">Not connected</span>
                    </div>
                    <div class="terminal-header-right">
                        <button class="header-btn" onclick="copyTerminal()" title="Copy selected text">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                        <button class="header-btn" onclick="pasteTerminal()" title="Paste from clipboard">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                        </button>
                        <button class="header-btn btn-disconnect" onclick="disconnectSSH()" title="Disconnect">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                            <span>Disconnect</span>
                        </button>
                    </div>
                </div>
                <div id="terminal"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
